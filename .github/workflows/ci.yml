name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# The Actions budget on this account is exhausted, so GitHub-hosted runners
# will not start a job at all. Every workflow in the fleet uses the
# pve-scripts self-hosted runner for that reason; this one is no exception.
#
# The WebKit harnesses in tests/*.py are deliberately NOT run here: they need
# a served page and a display. They run by hand against a local preview.
jobs:
  test:
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contract tests
        run: npm test

      # Has shadcn's live list moved away from the one we pin? The suite
      # pins it so an update is a deliberate act with a diff — but a pin
      # cannot ANNOUNCE drift, and that silence shipped two missing
      # components (code-block, trace) before anyone noticed by hand.
      #
      # Non-blocking on purpose: a third party's uptime or their decision
      # to add a component must not turn OUR build red or hold a deploy —
      # nothing here is broken when they move. It surfaces as a warning in
      # this run's summary, which is exactly loud enough to be seen.
      - name: Parity drift check (informational)
        run: node scripts/check-parity-live.mjs
        continue-on-error: true
